<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Elements Reference</title>
</head>
<body>

  <!-- Headings & Text -->
  <h1>My Web Page</h1>
  <p>Welcome to my site. Below are examples of core HTML tags.</p>

  <hr>

  <!-- Anchor Tag (Link) -->
  <h2>1. Links</h2>
  <a href="https://www.google.com" target="_blank" title="Opens Google in a new tab">
    Visit Google
  </a>

  <hr>

  <!-- Image Tag -->
  <h2>2. Image</h2>
  <img src="media/photo.jpg" alt="Description of the image" width="300">

  <hr>

  <!-- Video Tag -->
  <h2>3. Video</h2>
  <video src="media/sample-video.mp4" width="400" controls muted loop>
    Your browser does not support the video tag.
  </video>

  <hr>

  <!-- Audio Tag -->
  <h2>4. Audio</h2>
  <audio src="media/sample-audio.mp3" controls loop>
    Your browser does not support the audio tag.
  </audio>

</body>
</html>
